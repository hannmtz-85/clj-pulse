# The nginx of the clinical workspace's release (ADR-0030, point 4). Made by `bb spa:nginx` from pulse.spa.security (the
# headers and the policy) and pulse.spa.files (which path is which): do not edit it, change those and make it again. A
# test fails when this file is not what they make.
#
# The policy lets the page call http://localhost:4000 and http://localhost:8080/realms/pulse and nothing else; the workspace is
# served at http://localhost:3000. Other addresses are another file: `bb spa:nginx --api-base-url ... --issuer ... --base-url ...`.
#
# Where this does not answer as the Ring server of `bb spa:serve` does:
# - nginx resolves the segments '.' and '..' of a path itself, before any rule, so a path that goes up and comes down
#   again is the file it names; the Ring server says it is not a name. Neither serves anything outside the directory.
# - A path that is not valid percent-encoding is a 400 of nginx and a 404 of the Ring server (Jetty answers 400 to some of
#   them before the handler).
# - The Ring server answers /healthz to any method; nginx says 405 to a method that is not GET or HEAD before it looks at
#   the path.
# - The body of a problem has no `instance` in nginx: the path of the request is the one thing in it that the sender
#   chose.

# What a browser may keep of a response: public, max-age=31536000, immutable for a script whose name has the hash of its content,
# no-cache (it asks whether the file has changed) for the page, the stylesheet, the font and the icon, and
# no-store for anything else, an error and the health check among it.
map "$status:$uri" $spa_cache_control {
    default "no-store";
    "~^(?:200|304):(?:.*/)?[A-Za-z0-9_-]+\.[0-9A-Fa-f]{8,}\.js$" "public, max-age=31536000, immutable";
    "~^(?:200|304):/healthz$" "no-store";
    "~^(?:200|304):" "no-cache";
}

# The methods that a 405 says are allowed (an empty value is no header).
map $status $spa_allow {
    default "";
    405 "GET, HEAD";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # An empty segment ('//') is a name that is not there, as it is for the Ring server: keep the slashes.
    merge_slashes off;

    # The kinds of file that are served, and the charset of the ones that are text (text/html always has it).
    types {
        text/css css;
        text/html html;
        text/javascript js;
        image/svg+xml svg;
        text/plain txt;
        font/woff2 woff2;
    }
    charset utf-8;
    charset_types text/css text/javascript text/plain;

    # The same headers on every response, an error among them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4000 http://localhost:8080; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $spa_cache_control always;
    add_header Allow $spa_allow always;
    add_header X-Request-Id $request_id always;

    # Only reading is allowed.
    if ($request_method !~ "^(?:GET|HEAD)$") {
        return 405;
    }

    error_page 404 @spa_not_found;
    error_page 405 @spa_method_not_allowed;

    # The Ring server says that the process is serving at /healthz.
    location = /healthz {
        types {}
        default_type application/json;
        return 200 '{"status":"up"}';
    }

    # Not a name the workspace has a file or a route called: a name is made of plain segments (pulse.spa.files).
    location ~ "[^A-Za-z0-9._/-]|/[^A-Za-z0-9_]" {
        return 404;
    }

    # A name with the extension of a kind of file that the workspace has is that file, or it is not there.
    location ~ "\.(css|html|js|svg|txt|woff2)$" {
        try_files $uri =404;
    }

    # Any other extension, and any extension followed by a slash, is a file that is not there; it is never the page.
    location ~ "\.[A-Za-z0-9]+/?$" {
        return 404;
    }

    # Every other path is a route of the workspace, and the page is the answer to it (history mode).
    location / {
        try_files /index.html =404;
    }

    location @spa_not_found {
        types {}
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"There is no such file.","requestId":"$request_id"}';
    }

    location @spa_method_not_allowed {
        types {}
        default_type application/problem+json;
        return 405 '{"type":"about:blank","title":"Method Not Allowed","status":405,"requestId":"$request_id"}';
    }
}
