name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Node 22 is what the project asks for (bb doctor): the tests of the clinical workspace run on it
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/spa/package-lock.json

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          bb: latest

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('**/deps.edn') }}
          restore-keys: deps-

      - name: Install the npm packages of the clinical workspace
        run: npm ci --prefix apps/spa

      # What the documentation says CI runs: the format, the lint, the committed realm and design files, the tests on the JVM and
      # the tests of the clinical workspace on Node (ADR-0030)
      - name: Check
        run: bb check
